# Legacy Netlify hosting (the app now targets Cloudflare, see wrangler.jsonc). Response headers
# come from public/_headers, which Netlify also reads. Delete this file once Netlify is switched off.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
